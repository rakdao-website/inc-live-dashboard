<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Agent Tester</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        button.danger { background: #dc3545; }
        button.success { background: #28a745; }
        input, textarea {
            width: 100%;
            padding: 8px;
            margin: 6px 0 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        .row { display: flex; gap: 10px; align-items: center; }
        .status { padding: 8px 12px; border-radius: 6px; background: #e9ecef; margin: 10px 0; }
        .status.error { background: #f8d7da; color: #721c24; }
        .status.success { background: #d4edda; color: #155724; }
        pre { background: #f1f1f1; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 13px; }
        .flex { display: flex; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

<h1>🎙️ Voice Agent Tester</h1>

<div class="card">
    <h3>1. Settings</h3>
    <div class="row">
        <label style="flex:1;">Backend URL</label>
        <input id="baseUrl" value="http://localhost:8000" style="flex:3;" />
    </div>
    <div class="row">
        <label style="flex:1;">Endpoint</label>
        <select id="endpoint" style="flex:2;">
            <option value="/voice-agent/converse">/converse</option>
            <option value="/voice-agent/register">/register</option>
            <option value="/voice-agent/login">/login</option>
            <option value="/voice-agent/booking">/booking</option>
        </select>
    </div>
    <div style="margin-top:10px;">
        <label>Session ID (optional, leave empty for new)</label>
        <input id="sessionId" placeholder="e.g. abc-123" />
    </div>
</div>

<div class="card">
    <h3>2. Record Audio</h3>
    <div class="flex">
        <button id="recordBtn" class="success">🎤 Start Recording</button>
        <button id="stopBtn" class="danger" disabled>⏹ Stop & Send</button>
        <button id="clearBtn">🗑 Clear</button>
    </div>
    <div id="recordingStatus" class="status">Ready</div>
</div>

<div class="card">
    <h3>3. Or Send Text</h3>
    <div class="flex">
        <input id="textInput" placeholder="Type a message..." style="flex:3;" />
        <button id="sendTextBtn">📤 Send</button>
    </div>
</div>

<div class="card">
    <h3>📝 Transcript & Reply</h3>
    <div id="transcriptDisplay" class="status">Waiting...</div>
    <div id="replyDisplay" class="status">Waiting...</div>
    <div id="extractedDisplay" class="status" style="background:#e2e3e5;">Extracted: —</div>
    <div id="sessionDisplay" class="status" style="background:#d1ecf1;">Session: —</div>
</div>

<div class="card">
    <h3>🔊 Audio Player</h3>
    <audio id="audioPlayer" controls style="width:100%;"></audio>
</div>

<div class="card">
    <h3>📋 Raw Response</h3>
    <pre id="rawResponse">—</pre>
</div>

<script>
    // ===== DOM refs =====
    const baseUrlInput = document.getElementById('baseUrl');
    const endpointSelect = document.getElementById('endpoint');
    const sessionIdInput = document.getElementById('sessionId');
    const recordBtn = document.getElementById('recordBtn');
    const stopBtn = document.getElementById('stopBtn');
    const clearBtn = document.getElementById('clearBtn');
    const recordingStatus = document.getElementById('recordingStatus');
    const textInput = document.getElementById('textInput');
    const sendTextBtn = document.getElementById('sendTextBtn');
    const transcriptDisplay = document.getElementById('transcriptDisplay');
    const replyDisplay = document.getElementById('replyDisplay');
    const extractedDisplay = document.getElementById('extractedDisplay');
    const sessionDisplay = document.getElementById('sessionDisplay');
    const audioPlayer = document.getElementById('audioPlayer');
    const rawResponse = document.getElementById('rawResponse');

    // ===== Recording state =====
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let currentSessionId = null;

    // ===== Utility: send to backend =====
    async function sendToBackend(payload) {
        const baseUrl = baseUrlInput.value.trim();
        const endpoint = endpointSelect.value;
        const url = baseUrl + endpoint;
        const headers = { 'Content-Type': 'application/json' };

        // Add session ID if set
        if (sessionIdInput.value.trim()) {
            payload.session_id = sessionIdInput.value.trim();
        }

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers,
                body: JSON.stringify(payload),
            });
            const data = await response.json();
            return data;
        } catch (err) {
            console.error('Fetch error:', err);
            return { error: err.message };
        }
    }

    // ===== Process response =====
    function handleResponse(data) {
        // Update displays
        if (data.transcript) {
            transcriptDisplay.textContent = '📝 Transcript: ' + data.transcript;
            transcriptDisplay.className = 'status success';
        } else if (data.reply_text) {
            // Sometimes the reply is text only
            transcriptDisplay.textContent = '📝 (no transcript)';
            transcriptDisplay.className = 'status';
        }

        if (data.reply_text) {
            replyDisplay.textContent = '💬 Reply: ' + data.reply_text;
            replyDisplay.className = 'status success';
        } else {
            replyDisplay.textContent = '💬 Reply: (none)';
            replyDisplay.className = 'status';
        }

        if (data.extracted) {
            extractedDisplay.textContent = '📋 Extracted: ' + JSON.stringify(data.extracted, null, 2);
            extractedDisplay.className = 'status success';
        } else {
            extractedDisplay.textContent = '📋 Extracted: —';
            extractedDisplay.className = 'status';
        }

        if (data.session_id) {
            currentSessionId = data.session_id;
            sessionDisplay.textContent = '🆔 Session: ' + currentSessionId;
            sessionIdInput.value = currentSessionId; // update field
        } else if (sessionIdInput.value.trim()) {
            sessionDisplay.textContent = '🆔 Session: ' + sessionIdInput.value.trim();
        } else {
            sessionDisplay.textContent = '🆔 Session: (none)';
        }

        // Raw response
        rawResponse.textContent = JSON.stringify(data, null, 2);

        // Audio playback
        if (data.reply_audio) {
            try {
                const binaryString = atob(data.reply_audio);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                const blob = new Blob([bytes], { type: data.audio_content_type || 'audio/wav' });
                const url = URL.createObjectURL(blob);
                audioPlayer.src = url;
                audioPlayer.play().catch(e => console.warn('Auto-play blocked', e));
            } catch (e) {
                console.error('Audio decode error:', e);
            }
        } else {
            audioPlayer.src = '';
        }

        // If error
        if (data.error) {
            recordingStatus.textContent = '❌ Error: ' + data.error;
            recordingStatus.className = 'status error';
        }
    }

    // ===== Record Audio =====
    async function startRecording() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) audioChunks.push(event.data);
            };

            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                // Convert to base64
                const reader = new FileReader();
                reader.onloadend = async () => {
                    const base64data = reader.result.split(',')[1];
                    const payload = {
                        audio: base64data,
                        mime_type: 'audio/webm',
                    };
                    // Send
                    recordingStatus.textContent = '⏳ Sending...';
                    recordingStatus.className = 'status';
                    const data = await sendToBackend(payload);
                    handleResponse(data);
                    recordingStatus.textContent = '✅ Sent';
                    recordingStatus.className = 'status success';
                    // Clean up
                    stream.getTracks().forEach(track => track.stop());
                };
                reader.readAsDataURL(audioBlob);
            };

            mediaRecorder.start();
            isRecording = true;
            recordBtn.disabled = true;
            stopBtn.disabled = false;
            recordingStatus.textContent = '🔴 Recording...';
            recordingStatus.className = 'status error';
        } catch (err) {
            recordingStatus.textContent = '❌ Microphone error: ' + err.message;
            recordingStatus.className = 'status error';
        }
    }

    function stopRecording() {
        if (mediaRecorder && isRecording) {
            mediaRecorder.stop();
            isRecording = false;
            recordBtn.disabled = false;
            stopBtn.disabled = true;
        }
    }

    // ===== Send Text =====
    async function sendText() {
        const text = textInput.value.trim();
        if (!text) return;
        const payload = { message: text };
        recordingStatus.textContent = '⏳ Sending text...';
        recordingStatus.className = 'status';
        const data = await sendToBackend(payload);
        handleResponse(data);
        recordingStatus.textContent = '✅ Text sent';
        recordingStatus.className = 'status success';
    }

    // ===== Clear =====
    function clearAll() {
        audioPlayer.src = '';
        transcriptDisplay.textContent = '📝 Waiting...';
        transcriptDisplay.className = 'status';
        replyDisplay.textContent = '💬 Waiting...';
        replyDisplay.className = 'status';
        extractedDisplay.textContent = '📋 Extracted: —';
        extractedDisplay.className = 'status';
        sessionDisplay.textContent = '🆔 Session: —';
        rawResponse.textContent = '—';
        recordingStatus.textContent = 'Ready';
        recordingStatus.className = 'status';
        audioChunks = [];
        if (mediaRecorder) {
            try { mediaRecorder.stream.getTracks().forEach(t => t.stop()); } catch(e) {}
        }
        isRecording = false;
        recordBtn.disabled = false;
        stopBtn.disabled = true;
        // Keep session ID
    }

    // ===== Event listeners =====
    recordBtn.addEventListener('click', startRecording);
    stopBtn.addEventListener('click', stopRecording);
    clearBtn.addEventListener('click', clearAll);
    sendTextBtn.addEventListener('click', sendText);
    textInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendText(); });

    // Initial state
    stopBtn.disabled = true;
    clearAll();
</script>

</body>
</html>
