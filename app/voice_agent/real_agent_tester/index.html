<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Realtime Agent Tester</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1c2230;
    --border: #2a3140;
    --text: #e6e9ef;
    --text-dim: #8b94a7;
    --accent: #5b8def;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .subtitle { color: var(--text-dim); font-size: 13px; margin: 0 0 20px; }
  button {
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    margin-right: 8px;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: default; }
  #status {
    font-family: "SF Mono", Consolas, monospace;
    font-size: 12px;
    color: var(--text-dim);
    margin: 14px 0;
  }
  #transcript {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    max-width: 640px;
    min-height: 240px;
    max-height: 480px;
    overflow-y: auto;
    background: var(--panel);
    white-space: pre-wrap;
    font-size: 14px;
    line-height: 1.7;
  }
  .msg-user { color: var(--accent); }
  .msg-assistant { color: var(--text); }
  .hint { color: var(--text-dim); font-size: 12px; margin-top: 10px; max-width: 640px; }
  .sim-panel {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 16px;
    max-width: 640px;
  }
  .sim-panel label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 8px;
  }
  .sim-panel label:first-child { margin-top: 0; }
  .sim-panel input, .sim-panel select {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 13px;
    margin-top: 3px;
  }
  .sim-panel .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); }
  .sim-panel .checkbox-row input { width: auto; margin: 0; }
</style>
</head>
<body>
  <h1>Realtime Agent Tester</h1>
  <p class="subtitle">Connects directly to OpenAI's Realtime API over WebSocket - no kiosk UI needed.</p>

  <div class="sim-panel">
    <div class="checkbox-row">
      <input type="checkbox" id="sim-visitor" />
      <label for="sim-visitor" style="margin:0;">Simulate already-logged-in visitor (skips the greeting/collection questions)</label>
    </div>
    <div id="visitor-fields" style="display:none;">
      <label for="visitor-id">visitor_id</label>
      <input id="visitor-id" type="number" value="2" />
      <label for="visitor-name">visitor_name</label>
      <input id="visitor-name" type="text" value="Ayah" />
      <label for="visitor-type">visitor_type</label>
      <select id="visitor-type">
        <option value="client">client (existing customer)</option>
        <option value="visitor">visitor (new)</option>
      </select>
    </div>
  </div>

  <div>
    <button id="connect-btn" class="primary">Connect &amp; start talking</button>
    <button id="mute-btn" disabled>Mute</button>
    <button id="disconnect-btn" disabled>Disconnect</button>
  </div>

  <div id="status">idle</div>
  <div id="visitor-status" class="hint"></div>
  <div id="transcript"></div>
  <p class="hint">
    Backend must be running at http://127.0.0.1:8000 with OPENAI_API_KEY set.
    Once connected, just talk - voice activity detection handles turn-taking automatically.
  </p>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
